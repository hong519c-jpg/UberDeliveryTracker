plugins {
    id 'com.android.application'
}
android {
    namespace 'tw.local.ubertracker'
    compileSdk 35
    defaultConfig {
        applicationId 'tw.local.ubertracker'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6.0-status-text'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
